name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Racket ${{ matrix.racket }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        racket: ["9.0", "9.3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ matrix.racket }}
      - name: Install package
        run: raco pkg install --auto --no-docs --name keel --link
      - name: Test
        run: raco test -p keel
      - name: Build documentation
        # Documentation is platform independent; retain Racket 9.0 + 9.3 checks.
        if: matrix.os == 'ubuntu-latest'
        run: raco setup --doc-index --check-pkg-deps --pkgs keel
